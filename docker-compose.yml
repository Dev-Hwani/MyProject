version: '3.8'

services:
  # 1. Database (PostgreSQL)
  postgres_db:
    image: postgres:17
    container_name: compose_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: compose_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
    depends_on:
      - postgres_db

  # 3. Frontend (Vite + React)
  frontend:
    build: ./frontend
    container_name: compose_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: